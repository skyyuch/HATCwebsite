name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The build runs on the i18n/SSG fallback path (no hosted DB in CI).
      # hasDb() is false when DATABASE_URI is empty, so /admin/CMS reads fall back.
      DATABASE_URI: ''
      PAYLOAD_SECRET: ci-placeholder-secret-not-used
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Translation stays disabled in CI (server-only key is never exposed here).
      MT_API_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: i18n message key parity
        run: npm run i18n:check

      - name: Build (SSG fallback)
        run: npm run build
